<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found - BR Dental Clinic</title>
  <meta name="description" content="The page you were looking for could not be found at BR Dental Clinic.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/draft%20for%20clinic/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="/draft%20for%20clinic/style.css?v=24">
  <style>
    .notfound-wrap {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 2rem 1.25rem;
      background: var(--bg, #f8fafc);
    }
    .notfound-card {
      width: 100%;
      max-width: 34rem;
      padding: 2.5rem 2rem;
      text-align: center;
      background: #fff;
      border: 1px solid var(--border-color, #e5e7eb);
      border-radius: 14px;
    }
    .notfound-code {
      margin: 0 0 0.25rem;
      font-size: 3.25rem;
      font-weight: 800;
      line-height: 1;
      color: var(--teal-dark, #0F766E);
      letter-spacing: -0.03em;
    }
    .notfound-card h1 { margin: 0 0 0.6rem; font-size: 1.35rem; }
    .notfound-card p { margin: 0 0 1.75rem; color: var(--text-muted, #6b7280); line-height: 1.6; }
    .notfound-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; }
    .notfound-actions .btn { min-height: 44px; }
    .notfound-mark {
      display: block;
      width: 56px;
      height: 56px;
      margin: 0 auto 1.25rem;
      border-radius: 12px;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <main class="notfound-wrap">
    <div class="notfound-card">
      <img class="notfound-mark" src="/draft%20for%20clinic/icon-192.png" alt="">
      <p class="notfound-code">404</p>
      <h1>We couldn&rsquo;t find that page</h1>
      <p>
        The page may have been moved, or the address may be mistyped.
        You can return to the sign-in page or contact the clinic if you need help.
      </p>
      <div class="notfound-actions">
        <a class="btn btn-primary" href="/draft%20for%20clinic/index.html">Go to home page</a>
        <a class="btn btn-outline" href="/draft%20for%20clinic/login.html">Sign in</a>
      </div>
    </div>
  </main>
</body>
</html>
