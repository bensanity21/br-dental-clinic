<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BR Dental Clinic - Choose a New Password</title>
  <meta name="description" content="Choose a new password for your BR Dental Clinic patient account.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0F766E">
  <link rel="stylesheet" href="style.css?v=36">
</head>
<body>
  <main id="auth-screen" class="auth-wrapper">
    <section class="auth-visual" aria-label="BR Dental Clinic">
      <div class="auth-visual-inner">
        <div class="auth-brand-lockup">
          <img class="auth-brand-mark" src="brand-icon.png" alt="">
          <span>BR Dental Clinic</span>
        </div>
        <div class="auth-visual-copy">
          <p class="auth-eyebrow">ACCOUNT RECOVERY</p>
          <h2>Choose a new password.</h2>
          <p>Use at least 12 characters. Once you save it, this link stops working.</p>
        </div>
        <p class="auth-location" data-clinic="address">73 Nyugan Road · Dasmariñas City, Cavite</p>
      </div>
    </section>

    <section class="auth-card" aria-labelledby="auth-title">
      <header class="auth-header">
        <p class="auth-kicker">Almost done</p>
        <h1 id="auth-title" class="auth-heading">Set a new password</h1>
        <p class="auth-subtext">Enter your new password twice to confirm it.</p>
      </header>

      <div id="auth-alert" class="alert hidden" role="alert" aria-live="polite"></div>

      <form id="reset-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="reset-password">New Password <span class="req">*</span></label>
          <div class="password-input-group">
            <input type="password" id="reset-password" name="new_password" autocomplete="new-password" required minlength="12" maxlength="72" placeholder="At least 12 characters">
            <button type="button" class="btn-toggle-pass" data-target="reset-password" aria-label="Show password">Show</button>
          </div>
          <span class="field-error" id="reset-password-error"></span>
        </div>

        <div class="form-group">
          <label for="reset-confirm">Confirm New Password <span class="req">*</span></label>
          <div class="password-input-group">
            <input type="password" id="reset-confirm" name="confirm_password" autocomplete="new-password" required placeholder="Re-enter your new password">
            <button type="button" class="btn-toggle-pass" data-target="reset-confirm" aria-label="Show password">Show</button>
          </div>
          <span class="field-error" id="reset-confirm-error"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Save New Password</button>

        <p class="auth-switch-text">
          <a class="btn-link" href="login.html">Back to sign in</a>
        </p>
      </form>
    </section>
  </main>
  <div id="toast-container"></div>
  <script type="module" src="scripts/api.js?v=5"></script>
  <script type="module" src="scripts/toast.js?v=5"></script>
  <script type="module" src="scripts/clinic-info.js?v=1"></script>
  <script type="module" src="scripts/reset-password.js?v=1"></script>
</body>
</html>
